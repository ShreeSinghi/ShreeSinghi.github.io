{{ if .Site.Params.news.enable }}
<section id="news" class="container-fluid">
    <div class="container">
        <h2 class="text-center">{{ .Site.Params.news.title }}</h2>
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <ul class="news-list list-unstyled mb-0">
                    {{ range .Site.Params.news.items }}
                    <li class="news-item">
                        <span class="news-date">{{ .date }}</span>
                        <span class="news-content">{{ .content | markdownify }}</span>
                    </li>
                    {{ end }}
                </ul>
            </div>
        </div>
    </div>
</section>

<style>
/* A short list of dated updates. It used to sit in a 300px scroll box, which
   put a second scrollbar inside the page for three items; the list is simply
   laid out in full now. */
.news-list {
    border-top: 1px solid var(--border-color);
}

.news-item {
    display: grid;
    grid-template-columns: 8.5rem 1fr;
    gap: 0 1.5rem;
    align-items: baseline;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border-color);
}

.news-date {
    color: var(--text-secondary-color);
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.news-content {
    color: var(--text-color);
    font-size: 0.95rem;
    line-height: 1.6;
}

.news-content p {
    margin-bottom: 0;
}

.news-content a {
    color: var(--text-link-color);
    text-decoration: underline;
    text-decoration-color: var(--border-color-strong);
    text-underline-offset: 0.18em;
    transition: text-decoration-color 0.2s var(--ease-out);
}

.news-content a:hover {
    text-decoration-color: var(--primary-color);
}

@media (max-width: 575px) {
    .news-item {
        grid-template-columns: 1fr;
        gap: 0.35rem 0;
    }
}
</style>
{{ end }}
